name: rayyan_driver
description: "Rayyan E-Fleet driver app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  go_router: '>=16.0.0 <19.0.0'
  get_it: '>=8.0.0 <10.0.0'
  injectable: '>=2.5.0 <4.0.0'
  freezed_annotation: '>=3.0.0 <4.0.0'
  json_annotation: '>=4.9.0 <5.0.0'
  equatable: ^2.0.7
  dio: '^5.7.0'
  shared_preferences: '^2.3.0'
  flutter_secure_storage: '>=9.2.0 <12.0.0'
  intl: ^0.20.2
  flutter_svg: '^2.0.0'
  cached_network_image: '>=3.4.1 <5.0.0'
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'
  build_runner: '>=2.4.0 <3.0.0'
  freezed: '>=3.0.0 <5.0.0'
  json_serializable: '>=6.9.0 <7.0.0'
  injectable_generator: '>=2.7.0 <4.0.0'
  bloc_test: '>=10.0.0 <11.0.0'
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/illustrations/
    - assets/images/mock/
    - assets/icons/
    - assets/icons/figma/

  # Tajawal is a free (OFL) stand-in for Arabic, used as the fallback family.
  fonts:
    # Figma's Cocon Offc in its three weights.
    - family: Cocon
      fonts:
        - asset: assets/fonts/Cocon/Cocon-Light.otf
          weight: 300
        - asset: assets/fonts/Cocon/Cocon-Regular.otf
          weight: 400
        - asset: assets/fonts/Cocon/Cocon-Bold.otf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
